<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-labelledby="t d">
  <title id="t">Workout Tracker architecture</title>
  <desc id="d">A phone loads the app from CloudFront and a private S3 bucket, signs in with Cognito managed login (sign-ups checked by a Pre sign-up Lambda), and calls an API Gateway HTTP API with a JWT. The API invokes a Python Lambda that reads and writes one DynamoDB table. DNS is on Cloudflare and the TLS certificate is an ACM certificate in us-east-1.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14153A"/>
      <stop offset="1" stop-color="#0F1024"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#FF6B6B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2EC5FF"/></marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9D8FFF"/></marker>
    <marker id="a-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#FF6B6B"/></marker>
    <marker id="a-mango" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#FFB547"/></marker>
    <marker id="a-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B8F23A"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7C7FA8"/></marker>

    <!-- icons: 24x24, drawn in navy on a coloured tile -->
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g></symbol>
    <symbol id="i-bucket" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="2.6"/><path d="M4 6l2 13c.3 1.4 2.9 2.4 6 2.4s5.7-1 6-2.4L20 6"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></g></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/></g></symbol>
    <symbol id="i-api" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 3-2 3 1 0 2 1.5 2 3v2c0 2 1 3 3 3"/><path d="M16 4c2 0 3 1 3 3v2c0 1.5 1 3 2 3-1 0-2 1.5-2 3v2c0 2-1 3-3 3"/></g></symbol>
    <symbol id="i-lambda" viewBox="0 0 24 24"><path d="M5 21l6-11-3-6H5V3h4.5l9 16.5H21V21h-3.5L13 12.5 8.3 21z" fill="#0F1024"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2"><ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5v13c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-13"/><path d="M4 12c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="#0F1024" stroke-width="2" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></g><circle cx="12" cy="15.5" r="1.6" fill="#0F1024"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 18z" fill="none" stroke="#0F1024" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h1 { font-size: 30px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .h2 { font-size: 15px; fill: #A9ABD0; }
    .nt { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .ns { font-size: 12px; fill: #A9ABD0; }
    .zone { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #A9ABD0; }
    .lbl { font-size: 12px; font-weight: 600; }
    .step { font-size: 12px; font-weight: 800; fill: #0F1024; }
    .node { fill: #1B1C42; stroke-width: 1.5; }
  </style>

  <!-- background -->
  <rect width="1600" height="780" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="780" rx="28" fill="url(#glow1)"/>
  <rect width="1600" height="780" rx="28" fill="url(#glow2)"/>

  <!-- heading -->
  <rect x="56" y="38" width="44" height="6" rx="3" fill="#6C5CE7"/>
  <text x="56" y="80" class="h1">How Workout Tracker fits together</text>
  <text x="56" y="108" class="h2">Fully serverless on AWS, all in CloudFormation. Costs close to nothing when nobody is training.</text>

  <!-- zones -->
  <rect x="528" y="150" width="764" height="530" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#6C5CE7" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="552" y="180" class="zone">AWS · EU-WEST-2 · ONE CLOUDFORMATION STACK</text>
  <rect x="1316" y="150" width="240" height="170" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#2EC5FF" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1340" y="180" class="zone">US-EAST-1 · CERT STACK</text>

  <!-- ===== connectors (drawn under the nodes) ===== -->
  <!-- 1 load the app -->
  <path d="M236 372 H380 V240 H556" fill="none" stroke="#2EC5FF" stroke-width="2.5" marker-end="url(#a-sky)"/>
  <!-- 2 sign in -->
  <path d="M236 420 H556" fill="none" stroke="#9D8FFF" stroke-width="2.5" marker-end="url(#a-violet)"/>
  <!-- 3 API -->
  <path d="M236 468 H380 V600 H556" fill="none" stroke="#FF6B6B" stroke-width="2.5" marker-end="url(#a-coral)"/>

  <!-- step badges + labels -->
  <circle cx="380" cy="306" r="13" fill="#2EC5FF"/><text x="380" y="310.5" text-anchor="middle" class="step">1</text>
  <text x="404" y="270" class="lbl" fill="#2EC5FF">load the app</text>
  <text x="404" y="286" class="ns">HTTPS, own domain</text>
  <circle cx="300" cy="420" r="13" fill="#9D8FFF"/><text x="300" y="424.5" text-anchor="middle" class="step">2</text>
  <text x="404" y="410" class="lbl" fill="#9D8FFF">sign in</text>
  <text x="404" y="446" class="ns">code + PKCE</text>
  <circle cx="380" cy="534" r="13" fill="#FF6B6B"/><text x="380" y="538.5" text-anchor="middle" class="step">3</text>
  <text x="404" y="590" class="lbl" fill="#FF6B6B">API calls</text>
  <text x="404" y="626" class="ns">Bearer JWT</text>

  <!-- Cloudflare DNS hint -->
  <path d="M440 196 V234" fill="none" stroke="#FFB547" stroke-width="1.5" stroke-dasharray="3 4"/>
  <!-- inside AWS -->
  <path d="M760 240 H808" stroke="#2EC5FF" stroke-width="2" marker-end="url(#a-sky)"/>
  <text x="784" y="230" text-anchor="middle" class="lbl" fill="#2EC5FF">OAC</text>
  <path d="M760 420 H808" stroke="#9D8FFF" stroke-width="2" marker-end="url(#a-violet)"/>
  <path d="M660 462 V554" stroke="#9D8FFF" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-violet)"/>
  <text x="674" y="505" class="lbl" fill="#9D8FFF">verifies the JWT</text>
  <text x="674" y="521" class="ns">JWT authorizer</text>
  <path d="M760 600 H808" stroke="#FF6B6B" stroke-width="2" marker-end="url(#a-coral)"/>
  <path d="M1012 600 H1060" stroke="#B8F23A" stroke-width="2" marker-end="url(#a-lime)"/>
  <!-- logs -->
  <path d="M1012 420 H1060" stroke="#7C7FA8" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#a-grey)"/>
  <path d="M960 558 V512 H1130 V466" fill="none" stroke="#7C7FA8" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#a-grey)"/>
  <text x="1046" y="503" text-anchor="middle" class="ns">logs</text>
  <!-- certificate -->
  <path d="M1436 282 V332 H700 V286" fill="none" stroke="#2EC5FF" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a-sky)"/>
  <rect x="1170" y="321" width="96" height="22" rx="11" fill="#14153A"/>
  <text x="1218" y="336.5" text-anchor="middle" class="lbl" fill="#2EC5FF">TLS cert</text>

  <!-- ===== phone ===== -->
  <rect x="56" y="282" width="180" height="290" rx="30" fill="#1B1C42" stroke="url(#phone)" stroke-width="3"/>
  <rect x="116" y="296" width="60" height="8" rx="4" fill="#0F1024"/>
  <rect x="116" y="330" width="60" height="60" rx="16" fill="url(#phone)"/>
  <path d="M130 372 l12-12 8 8 14-15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="420" text-anchor="middle" class="nt">Your phone</text>
  <text x="146" y="440" text-anchor="middle" class="ns">Safari / home screen</text>
  <rect x="80" y="462" width="132" height="10" rx="5" fill="#2EC5FF" fill-opacity="0.8"/>
  <rect x="80" y="480" width="96" height="10" rx="5" fill="#FF6B6B" fill-opacity="0.8"/>
  <rect x="80" y="498" width="116" height="10" rx="5" fill="#B8F23A" fill-opacity="0.8"/>
  <text x="146" y="540" text-anchor="middle" class="ns">vanilla HTML, CSS, JS</text>
  <text x="146" y="604" text-anchor="middle" class="ns">You and the crew</text>

  <!-- ===== Cloudflare ===== -->
  <rect x="320" y="140" width="190" height="56" rx="14" class="node" stroke="#FFB547"/>
  <rect x="332" y="150" width="36" height="36" rx="10" fill="#FFB547"/><use href="#i-cloud" x="338" y="156" width="24" height="24"/>
  <text x="380" y="164" class="lbl" fill="#FFFFFF">Cloudflare DNS</text>
  <text x="380" y="182" class="ns">CNAME, DNS only</text>

  <!-- ===== nodes: x, y, accent ===== -->
  <!-- CloudFront -->
  <rect x="560" y="198" width="200" height="84" rx="16" class="node" stroke="#2EC5FF"/>
  <rect x="574" y="218" width="44" height="44" rx="12" fill="#2EC5FF"/><use href="#i-globe" x="584" y="228" width="24" height="24"/>
  <text x="630" y="232" class="nt">CloudFront</text>
  <text x="630" y="251" class="ns">HTTPS only</text>
  <text x="630" y="267" class="ns">custom domain</text>

  <!-- S3 -->
  <rect x="812" y="198" width="200" height="84" rx="16" class="node" stroke="#2EC5FF"/>
  <rect x="826" y="218" width="44" height="44" rx="12" fill="#2EC5FF"/><use href="#i-bucket" x="836" y="228" width="24" height="24"/>
  <text x="882" y="232" class="nt">S3 bucket</text>
  <text x="882" y="251" class="ns">private, no public</text>
  <text x="882" y="267" class="ns">access, the site</text>

  <!-- Cognito -->
  <rect x="560" y="378" width="200" height="84" rx="16" class="node" stroke="#9D8FFF"/>
  <rect x="574" y="398" width="44" height="44" rx="12" fill="#9D8FFF"/><use href="#i-user" x="584" y="408" width="24" height="24"/>
  <text x="630" y="412" class="nt">Cognito</text>
  <text x="630" y="431" class="ns">branded managed</text>
  <text x="630" y="447" class="ns">login, Essentials</text>

  <!-- Pre sign-up -->
  <rect x="812" y="378" width="200" height="84" rx="16" class="node" stroke="#9D8FFF"/>
  <rect x="826" y="398" width="44" height="44" rx="12" fill="#9D8FFF"/><use href="#i-ticket" x="836" y="408" width="24" height="24"/>
  <text x="882" y="412" class="nt">Pre sign-up λ</text>
  <text x="882" y="431" class="ns">lets friends in only</text>
  <text x="882" y="447" class="ns">with the invite code</text>

  <!-- CloudWatch -->
  <rect x="1064" y="378" width="200" height="84" rx="16" class="node" stroke="#7C7FA8"/>
  <rect x="1078" y="398" width="44" height="44" rx="12" fill="#A9ABD0"/><use href="#i-chart" x="1088" y="408" width="24" height="24"/>
  <text x="1134" y="412" class="nt">CloudWatch</text>
  <text x="1134" y="431" class="ns">Lambda logs,</text>
  <text x="1134" y="447" class="ns">kept 14 days</text>

  <!-- API Gateway -->
  <rect x="560" y="558" width="200" height="84" rx="16" class="node" stroke="#FF6B6B"/>
  <rect x="574" y="578" width="44" height="44" rx="12" fill="#FF6B6B"/><use href="#i-api" x="584" y="588" width="24" height="24"/>
  <text x="630" y="592" class="nt">API Gateway</text>
  <text x="630" y="611" class="ns">HTTP API, CORS,</text>
  <text x="630" y="627" class="ns">10 req/s throttle</text>

  <!-- Lambda -->
  <rect x="812" y="558" width="200" height="84" rx="16" class="node" stroke="#FFB547"/>
  <rect x="826" y="578" width="44" height="44" rx="12" fill="#FFB547"/><use href="#i-lambda" x="836" y="588" width="24" height="24"/>
  <text x="882" y="592" class="nt">Lambda</text>
  <text x="882" y="611" class="ns">Python 3.12, user</text>
  <text x="882" y="627" class="ns">is always JWT sub</text>

  <!-- DynamoDB -->
  <rect x="1064" y="558" width="200" height="84" rx="16" class="node" stroke="#B8F23A"/>
  <rect x="1078" y="578" width="44" height="44" rx="12" fill="#B8F23A"/><use href="#i-db" x="1088" y="588" width="24" height="24"/>
  <text x="1134" y="592" class="nt">DynamoDB</text>
  <text x="1134" y="611" class="ns">one on-demand table,</text>
  <text x="1134" y="627" class="ns">point-in-time restore</text>

  <!-- ACM -->
  <rect x="1336" y="198" width="200" height="84" rx="16" class="node" stroke="#2EC5FF"/>
  <rect x="1350" y="218" width="44" height="44" rx="12" fill="#2EC5FF"/><use href="#i-lock" x="1360" y="228" width="24" height="24"/>
  <text x="1406" y="232" class="nt">ACM</text>
  <text x="1406" y="251" class="ns">free TLS certificate,</text>
  <text x="1406" y="267" class="ns">DNS-validated</text>

  <!-- side note -->
  <text x="1336" y="420" class="lbl" fill="#B8F23A">Privacy by design</text>
  <text x="1336" y="442" class="ns">IAM lets the Lambda touch</text>
  <text x="1336" y="458" class="ns">one table, nothing else.</text>
  <text x="1336" y="482" class="ns">Friends only ever see</text>
  <text x="1336" y="498" class="ns">progress numbers, never</text>
  <text x="1336" y="514" class="ns">anyone's workouts.</text>
  <text x="1336" y="560" class="lbl" fill="#FFB547">No idle bills</text>
  <text x="1336" y="582" class="ns">No servers, VPC or NAT.</text>
  <text x="1336" y="598" class="ns">Everything is billed per</text>
  <text x="1336" y="614" class="ns">request or per GB.</text>

  <!-- footer legend -->
  <g transform="translate(56 724)">
    <circle cx="8" cy="0" r="6" fill="#2EC5FF"/><text x="22" y="4.5" class="ns">site delivery</text>
    <circle cx="130" cy="0" r="6" fill="#9D8FFF"/><text x="144" y="4.5" class="ns">identity</text>
    <circle cx="226" cy="0" r="6" fill="#FF6B6B"/><text x="240" y="4.5" class="ns">API</text>
    <circle cx="290" cy="0" r="6" fill="#FFB547"/><text x="304" y="4.5" class="ns">compute + DNS</text>
    <circle cx="420" cy="0" r="6" fill="#B8F23A"/><text x="434" y="4.5" class="ns">data</text>
    <path d="M500 0 h30" stroke="#A9ABD0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="540" y="4.5" class="ns">control / trust, not request traffic</text>
  </g>
</svg>
