<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-labelledby="t">
  <title id="t">A tall athlete in a coral tank top striding forward with a dumbbell, checking his workout on his phone</title>
  <defs>
    <linearGradient id="kb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC970"/><stop offset="1" stop-color="#F29A1F"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8080"/><stop offset="1" stop-color="#F25555"/>
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7D6EF0"/><stop offset="1" stop-color="#5A4AD6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1C3A"/><stop offset="1" stop-color="#0F1024"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="160" cy="622" rx="112" ry="12" fill="#0F1024" opacity=".18"/>

