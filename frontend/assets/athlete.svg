  <path d="M148 92 L172 92 L174 116 C166 122 154 122 146 116 Z" fill="#43291B"/>
  <ellipse cx="160" cy="66" rx="25" ry="31" fill="#5A3825"/>
  <path d="M172 40 C186 50 188 78 178 92 C172 98 166 100 160 100 C170 90 176 64 172 40 Z" fill="#43291B" opacity=".7"/>
  <ellipse cx="135" cy="70" rx="5" ry="8" fill="#5A3825"/>
  <ellipse cx="185" cy="70" rx="5" ry="8" fill="#43291B"/>
  <!-- short hair -->
  <path d="M134 60 C132 38 146 30 160 30 C176 30 188 38 186 60 C182 48 176 44 160 44 C146 44 138 48 134 60 Z" fill="#1A1110"/>
  <!-- short beard -->
  <path d="M138 76 C140 92 150 98 160 98 C170 98 180 92 182 76 C178 86 172 90 160 90 C148 90 142 86 138 76 Z" fill="#1A1110"/>
  <!-- face: brows, eyes, smile -->
  <path d="M144 60 L154 58" stroke="#1A1110" stroke-width="3" stroke-linecap="round"/>
  <path d="M166 58 L176 60" stroke="#1A1110" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="67" r="2.6" fill="#1A1110"/>
  <circle cx="170" cy="67" r="2.6" fill="#1A1110"/>
  <path d="M152 82 C156 86 164 86 168 82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- FRONT ARM (his right) holding the dumbbell -->
  <path d="M106 128 C80 132 72 168 76 206 L102 208 C104 186 110 164 120 148 Z" fill="#5A3825"/>
  <path d="M94 140 C84 156 82 182 86 206 L94 206 C92 184 94 160 100 144 Z" fill="#43291B" opacity=".35"/>
  <path d="M76 200 C70 220 76 248 86 272 L108 270 C104 246 104 222 102 202 Z" fill="#5A3825"/>
  <path d="M96 206 C96 230 98 252 102 270 L108 270 C104 248 104 224 102 204 Z" fill="#43291B" opacity=".45"/>
  <!-- wrist band -->
  <rect x="84" y="260" width="26" height="10" rx="4" fill="#2EC5FF"/>
  <!-- dumbbell, held at his side -->
  <rect x="64" y="275" width="68" height="9" rx="4.5" fill="#0F1024"/>
  <rect x="52" y="256" width="16" height="46" rx="6" fill="url(#kb)"/>
  <rect x="128" y="256" width="16" height="46" rx="6" fill="url(#kb)"/>
  <rect x="44" y="263" width="10" height="32" rx="4" fill="#E08A12"/>
  <rect x="142" y="263" width="10" height="32" rx="4" fill="#E08A12"/>
  <rect x="55" y="260" width="4" height="22" rx="2" fill="#FFFFFF" opacity=".55"/>
  <rect x="131" y="260" width="4" height="22" rx="2" fill="#FFFFFF" opacity=".55"/>
  <ellipse cx="98" cy="279" rx="13" ry="10" fill="#5A3825"/>
  <path d="M88 276 C92 272 104 272 108 276" stroke="#43291B" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- PHONE in his left hand -->
  <g transform="rotate(-12 180 214)">
    <rect x="160" y="178" width="44" height="78" rx="9" fill="#0F1024"/>
    <rect x="164" y="184" width="36" height="66" rx="6" fill="url(#screen)"/>
    <path d="M168 236 L176 228 L182 232 L194 216" stroke="#B8F23A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="168" y="190" width="18" height="4" rx="2" fill="#F7F7FB" opacity=".9"/>
    <rect x="168" y="198" width="26" height="3" rx="1.5" fill="#B9BBD6" opacity=".6"/>
    <circle cx="194" cy="216" r="3" fill="#B8F23A"/>
  </g>
  <!-- fingers over the phone edge -->
  <path d="M180 246 C176 236 184 228 194 234 L200 250 C194 256 184 256 180 246 Z" fill="#43291B"/>
</svg>
