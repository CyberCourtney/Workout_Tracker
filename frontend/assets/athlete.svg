  <path d="M220 568 L246 562 L250 586 L224 592 Z" fill="#B8F23A"/>
  <path d="M220 588 C220 578 252 574 262 582 C276 592 284 600 280 608 L222 608 C218 602 218 596 220 588 Z" fill="#2EC5FF"/>
  <rect x="220" y="602" width="62" height="8" rx="4" fill="#0F1024"/>

  <!-- FRONT LEG (his right, stepping forward) -->
  <path d="M110 330 C102 382 102 432 108 472 L136 474 C142 430 154 382 158 330 Z" fill="#5A3825"/>
  <path d="M146 336 C140 388 136 432 134 472 L124 472 C128 430 134 386 140 336 Z" fill="#43291B" opacity=".5"/>
  <path d="M108 466 C96 494 96 532 102 580 L122 582 C124 548 138 506 136 470 Z" fill="#5A3825"/>
  <path d="M126 480 C132 506 124 548 120 582 L114 582 C118 548 124 510 120 480 Z" fill="#43291B" opacity=".55"/>
  <path d="M98 572 L124 574 L122 596 L96 594 Z" fill="#B8F23A"/>
  <path d="M94 592 C92 584 124 582 128 592 C134 600 132 606 128 610 L60 610 C56 602 64 598 78 596 Z" fill="#2EC5FF"/>
  <rect x="58" y="604" width="74" height="8" rx="4" fill="#0F1024"/>
  <path d="M72 598 L104 596" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".8"/>

  <!-- SHORTS -->
  <path d="M114 252 L208 252 L220 356 L172 362 L162 312 L152 362 L100 356 Z" fill="url(#shorts)"/>
  <path d="M114 252 L208 252 L209 266 L113 266 Z" fill="#4A3BC4"/>
  <path d="M198 270 L218 354 L209 356 L191 272 Z" fill="#B8F23A"/>

  <!-- BACK ARM (his left) holding the phone up -->
  <path d="M212 126 C238 132 248 168 240 208 L216 210 C216 188 210 166 198 150 Z" fill="#43291B"/>
  <path d="M240 200 C242 226 226 246 198 254 L190 236 C206 232 216 222 216 206 Z" fill="#43291B"/>

  <!-- TORSO / TANK TOP -->
  <path d="M102 128 C120 118 140 114 160 114 C180 114 200 118 216 128 L208 196 C206 222 206 240 208 258 L114 258 C116 240 116 222 114 196 Z" fill="url(#tank)"/>
  <!-- arm holes show the shoulders -->
  <path d="M102 128 C116 124 124 130 126 146 C126 162 120 176 114 190 L104 150 Z" fill="#5A3825"/>
  <path d="M216 128 C204 124 196 130 194 146 C194 162 200 176 208 190 L214 150 Z" fill="#43291B"/>
  <!-- tank top neckline + side panel + stripe -->
  <path d="M138 116 C144 134 176 134 182 116 C176 114 170 113 160 113 C150 113 144 114 138 116 Z" fill="#5A3825"/>
  <path d="M146 116 C150 126 170 126 174 116 Z" fill="#43291B" opacity=".6"/>
  <path d="M186 140 L208 196 C206 222 206 240 208 258 L190 258 Z" fill="#E14848" opacity=".55"/>
  <path d="M128 176 L188 168 L189 180 L129 188 Z" fill="#FFB547"/>

