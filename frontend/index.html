<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <title>Workouts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" class="boot">
    <p id="boot-msg">Loading…</p>
  </div>

  <main id="app" hidden>
    <!-- CALENDAR -->
    <section id="view-calendar" class="view">
      <header class="large-header">
        <h1>Calendar</h1>
        <button class="icon-btn" data-open-settings aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg>
        </button>
      </header>

      <div class="card cal-card">
        <div class="cal-nav">
          <button class="icon-btn plain" id="prev-month" aria-label="Previous month">‹</button>
          <h2 id="month-title"></h2>
          <button class="icon-btn plain" id="next-month" aria-label="Next month">›</button>
          <button class="pill-btn" id="cal-today">Today</button>
        </div>
        <div class="cal-grid cal-weekdays" aria-hidden="true">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div id="cal-grid" class="cal-grid" role="grid"></div>
        <div class="cal-legend" aria-hidden="true">
          <span><i class="dot done"></i>Completed</span>
          <span><i class="dot planned"></i>Planned</span>
        </div>
      </div>

      <div class="day-head">
        <h2 id="day-title"></h2>
        <button class="pill-btn" id="day-add">+ Add workout</button>
      </div>
      <ul id="day-list" class="workout-list"></ul>
      <p id="day-empty" class="empty" hidden>No workouts on this day.</p>
    </section>

    <!-- WORKOUT (active draft) -->
    <section id="view-workout" class="view" hidden>
      <header class="large-header">
        <div>
          <h1 id="wk-title">Workout</h1>
          <p id="wk-sub" class="subtitle"></p>
        </div>
        <button class="icon-btn" data-open-settings aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg>
        </button>
      </header>

      <div id="wk-empty" class="empty-state">
        <p>No workout in progress.</p>
        <button class="btn primary" id="wk-start-empty">Start Workout</button>
      </div>

      <div id="wk-editor" hidden>
        <ol id="wk-exercises" class="exercise-list"></ol>
        <button class="btn secondary" id="wk-add-ex">+ Add exercise</button>
        <p id="wk-error" class="error" role="alert" hidden></p>
        <div class="wk-actions">
          <button class="btn primary" id="wk-finish">Finish</button>
          <button class="btn text danger" id="wk-discard">Discard</button>
        </div>
      </div>
      <datalist id="exercise-names"></datalist>
    </section>

    <!-- PROGRESS -->
    <section id="view-progress" class="view" hidden>
      <header class="large-header">
        <h1>Progress</h1>
        <button class="icon-btn" data-open-settings aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg>
        </button>
      </header>
      <div id="prog-content">
        <label class="field-label" for="prog-exercise">Exercise</label>
        <select id="prog-exercise"></select>
        <div class="segmented" id="prog-metric" role="radiogroup" aria-label="Metric">
          <button role="radio" data-metric="e1rm">Est. 1RM</button>
          <button role="radio" data-metric="volume">Volume</button>
          <button role="radio" data-metric="top">Top set</button>
        </div>
        <div class="card chart-card">
          <p class="chart-caption" id="chart-caption"></p>
          <div id="chart" class="chart"></div>
          <div id="chart-tip" class="chart-tip" hidden></div>
        </div>
      </div>
      <div id="prog-empty" class="empty-state" hidden>
        <p>No completed workouts yet.</p>
        <p class="muted">Finish a workout and your progress will show up here.</p>
      </div>
    </section>

    <button class="fab" id="start-btn">Start Workout</button>

    <nav class="tabbar" aria-label="Sections">
      <button data-view="calendar" class="on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Calendar
      </button>
      <button data-view="workout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>
        Workout
      </button>
      <button data-view="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
        Progress
      </button>
    </nav>
  </main>

  <!-- Workout detail sheet -->
  <dialog id="detail" class="sheet">
    <div class="sheet-head">
      <span></span>
      <strong id="detail-title"></strong>
      <button class="btn-link" data-close>Done</button>
    </div>
    <div id="detail-body"></div>
    <div class="sheet-actions">
      <button class="btn primary" id="detail-start" hidden>Start Workout</button>
      <button class="btn secondary" id="detail-edit">Edit</button>
      <button class="btn text danger" id="detail-delete">Delete</button>
    </div>
  </dialog>

  <!-- Settings sheet -->
  <dialog id="settings" class="sheet">
    <div class="sheet-head">
      <span></span>
      <strong>Settings</strong>
      <button class="btn-link" data-close>Done</button>
    </div>
    <div class="card settings-card">
      <div class="row">
        <span>Weight unit</span>
        <div class="segmented small" id="unit-toggle" role="radiogroup" aria-label="Weight unit">
          <button role="radio" data-unit="kg">kg</button>
          <button role="radio" data-unit="lb">lb</button>
        </div>
      </div>
    </div>
    <button class="btn text danger" id="sign-out">Sign Out</button>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.68-.98l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.6.25-1.17.58-1.68.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65a7.8 7.8 0 0 0 0 1.94l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.3.61.22l2.49-1c.51.4 1.08.73 1.68.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.6-.25 1.17-.58 1.68-.98l2.49 1c.22.08.48 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></symbol>
  </svg>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
